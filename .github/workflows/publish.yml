# Publishes to npm via OIDC trusted publishing (no stored token).
# Trigger: push a version tag like v1.18.0 matching package.json version.
# One-time setup on npmjs.com (after any account suspension lifts): package ->
# Settings -> Trusted Publisher -> GitHub Actions -> this repo + workflow
# ".github/workflows/publish.yml". Requires npm CLI >= 11.5 (installed below).
name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # npm >= 11.5 for trusted publishing
      - run: npm install --no-audit --no-fund
      - run: npm run build --if-present
      - run: npm publish
